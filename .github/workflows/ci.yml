name: CI
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build:web
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib
      - run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --example media_probe
      - run: npm run check:probe
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Validate top-level-await Antigravity workflows
        run: python3 -c "import ast, glob; [compile(open(p).read(), p, 'exec', flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT) for p in glob.glob('tools/workflows/*.py')]"
