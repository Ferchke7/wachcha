name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Wachcha ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            ## Wachcha ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Open-source cross-platform media center for **Movies**, **Russian & World TV**, **Turkish Dizis**, **Anime**, **Live M3U8**, and **Stremio Addons**.

            - **Download Portal & Live Web App**: https://ferchke7.github.io/wachcha/
            - **SHA-256 Verification**: See `SHA256SUMS.txt` attached below.

            ### Included Packages
            - **Windows (x64)**: NSIS Installer (`.exe`), WiX Installer (`.msi`), and Portable Archive (`.zip`)
            - **Android & Android TV**: Signed Universal `.apk` (`arm64-v8a` + `armeabi-v7a` + `x86_64`) and ARM64 `.apk` with Leanback TV launcher
            - **macOS (Apple Silicon)**: `.dmg` disk image (`xattr -cr /Applications/Wachcha.app` if Gatekeeper prompts)
            - **Linux (x64)**: Portable `.AppImage`, Debian/Ubuntu `.deb`, and Fedora/RHEL `.rpm`
          files: |
            artifacts/*
          generate_release_notes: true
          make_latest: true
